[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-operational-service"
version = "1.0.0"
description = "Synchronous operational farm-management service for Farm Management"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.17.2",
  "email-validator==2.3.0",
  "fastapi==0.121.3",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.12.0",
  "python-multipart==0.0.33",
  "pwdlib[argon2]==0.3.0",
  "PyJWT==2.10.1",
  "SQLAlchemy==2.0.44",
  "uvicorn[standard]==0.38.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "jsonschema==4.25.1",
  "mypy==1.18.2",
  "openapi-spec-validator==0.7.2",
  "pytest==9.0.1",
  "pytest-cov==7.0.0",
  "PyYAML==6.0.3",
  "ruff==0.14.6",
  "types-openpyxl==3.1.5.20261017",
  "types-PyYAML==6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  # starlette.testclient (third-party) still references the deprecated anyio.abc.BlockingPortal
  # alias. Starlette switched to anyio.from_thread.BlockingPortal in 1.7.0, but the pinned FastAPI
  # only allows starlette<0.51. Remove this filter once FastAPI/Starlette are upgraded.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true

